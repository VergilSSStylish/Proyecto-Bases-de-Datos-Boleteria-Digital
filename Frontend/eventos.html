<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityBox</title>
    <script src="https://kit.fontawesome.com/21d7f36c31.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/eventos.css">
</head>
<body>

    <!-----barra de navegación------>
    <nav class="navbar navbar-expand-lg py-3 py-lg-0 shadow" id="main-navbar">
        <div class="container px-4">
            <div onclick="location.href='index.html'" style="cursor: pointer;">
                <img src="assets/logoblanco.png" alt="logo" id="img-logo">
            </div>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#top-navbar" aria-controls="top-navbar">
                <i class="fa-solid fa-bars" style="font-size: larger; color: white;"></i>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="top-navbar" aria-labelledby="top-navbarLabel">
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#top-navbar" aria-controls="top-navbar">
                    <div class="d-flex justify-content-between p-3 align-items-center">
                        <img src="assets/logoblanco.png" alt="logo" id="img-logo-mobile">
                        <i class="fa-regular fa-circle-xmark" style="font-size: larger; color: white;"></i>
                    </div>
                </button>
                <ul class="navbar-nav ms-lg-auto p-4 p-lg-0 align-items-center" style="font-size: 1.2rem">
                    <li class="nav-item px-3 px-lg-2 py-1 py-lg-4">
                        <a class="nav-links" href="eventos.html" id="link-eventos">Explora eventos</a>
                    </li>
                    <li class="nav-item px-3 px-lg-2 py-1 py-lg-4">
                        <a class="nav-links" href="tickets.html" id="link-tickets">Mis tickets</a>
                    </li>
                    <li class="nav-item px-3 px-lg-2 py-1 py-lg-4">
                        <div>
                            <a class="nav-links"  href="cuenta.html" id="link-cuenta">Mi cuenta</a>
                        </div>
                    </li>
                    <li class="nav-item px-3 px-lg-2 py-1 py-lg-4">
                        <a class="nav-links position-relative" href="carrito.html" id="link-carrito" title="Ver carrito">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span id="cart-badge" class="cart-badge">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!--sección de filtros-->
    <section id="filters-section">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Buscar un evento...">
        </div>

        <!--botones según tabla categorías-->
        <div id="category-filters">
            <button class="filter-btn active" data-category="all">Todos</button>
            <button class="filter-btn" data-category="Música">Música</button>
            <button class="filter-btn" data-category="Tecnología">Tecnología</button>
            <button class="filter-btn" data-category="Teatro">Teatro</button>
            <button class="filter-btn" data-category="Deportes">Deportes</button>
        </div>
    </section>

    <!--sección de todos los eventos-->
    <section id="events-section">
        <div id="events-container">
            
            <!--se renderizan según la bd-->
            <div class="event-card">
                <div class="event-img">
                    <img src="assets/poster prueba.jpg" alt="Evento 3" class="event-image">
                </div>
                <div class="event-info">
                    <p class="event-category">Categoría</p>
                    <h4 class="event-title">Nombre del evento</h4>
                    <p class="event-date">Fecha del evento</p>
                    <p class="event-location"><i class="fa-solid fa-location-dot"></i>Ubicación del evento</p>
                </div>
            </div>
        </div>    
    </section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
