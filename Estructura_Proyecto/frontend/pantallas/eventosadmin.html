
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityBox | Eventos</title>

    <script src="https://kit.fontawesome.com/21d7f36c31.js" crossorigin="anonymous"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <!--esta es misma barra de navegacion de las otras pantallas del admin -->
    <header class="header">
        <nav class="admin-navbar">

            <a href="dashboard.html">
                <img src="../assets/logoblanco.png" alt="CityBox" class="logo">
            </a>

            <div class="nav-options">
                <a href="dashboard.html">Dashboard</a>
                <a href="usuariosadmin.html">Usuarios</a>
                <a href="eventosadmin.html" class="active">Eventos</a>
                <a href="recintosadmin.html">Recintos</a>
                <a href="facturacionadmin.html">Facturación</a>
                <a href="configuracionadmin.html">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>

        </nav>
    </header>

    <main class="admin-container">

        <h2 class="section-title">Gestión de eventos</h2>

        <section class="admin-card">

            <div class="card-header-admin">

                <h3 class="card-title">Eventos registrados</h3>

                <button class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i>
                    Crear evento
                </button>

            </div>

            <hr>

            <!-- buscador de eventos -->
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="search"
                       id="buscar-evento"
                       placeholder="Buscar evento...">
            </div>

            <!-- aqui se van a renderizar los eventos registrados -->
            <div id="lista-eventos">

            </div>

        </section>

        <!--aun no la termino pero ya tengo sueño-->

    </main>

</body>
</html>
