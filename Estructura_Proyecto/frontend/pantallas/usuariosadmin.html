
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityBox | Usuarios</title>

    <script src="https://kit.fontawesome.com/21d7f36c31.js" crossorigin="anonymous"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <!-- misma barra de navegacion que se utiliza en el dashboard -->
    <header class="header">
        <nav class="admin-navbar">

            <a href="dashboard.html">
                <img src="../assets/logoblanco.png" alt="CityBox" class="logo">
            </a>

            <div class="nav-options">
                <a href="dashboard.html">Dashboard</a>
                <a href="usuariosadmin.html" class="active">Usuarios</a>
                <a href="eventosadmin.html">Eventos</a>
                <a href="recintosadmin.html">Recintos</a>
                <a href="facturacionadmin.html">Facturación</a>
                <a href="configuracionadmin.html">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>

        </nav>
    </header>

    <main class="admin-container">

        <h2 class="section-title">Usuarios registrados</h2>

        <!--se muesrtran los clientes registrados -->
        <section class="admin-card">

            <div class="card-header-admin">

                <h3 class="card-title">Clientes</h3>

                <!-- buscador para encontrar a un cliente por su nombre o correo -->
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="search"
                           id="buscar-cliente"
                           placeholder="Buscar cliente...">
                </div>

            </div>

            <hr>

            <!-- tabla para renderizar los datos de los clientes -->
            <div class="table-responsive">

                <table class="table table-dark admin-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo electrónico</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="lista-clientes">

                        <!--datos de ejemplo por mientras-->

                        <tr>
                            <td>4</td>
                            <td>Sofía</td>
                            <td>usuario4@ejemplo.test</td>
                            <td>
                                <button class="btn btn-outline-primary btn-sm">
                                    <i class="fa-solid fa-eye"></i>
                                    Ver
                                </button>
                            </td>
                        </tr>

                        <tr>
                            <td>5</td>
                            <td>Daniel</td>
                            <td>usuario5@ejemplo.test</td>
                            <td>
                                <button class="btn btn-outline-primary btn-sm">
                                    <i class="fa-solid fa-eye"></i>
                                    Ver
                                </button>
                            </td>
                        </tr>

                        <tr>
                            <td>6</td>
                            <td>Nombre del cliente</td>
                            <td>usuario6@ejemplo.test</td>
                            <td>
                                <button class="btn btn-outline-primary btn-sm">
                                    <i class="fa-solid fa-eye"></i>
                                    Ver
                                </button>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="table-footer">

                <!--botones para mas clientes si hay-->
                <div class="pagination-admin">

                    <button class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>

                    <button class="btn btn-primary btn-sm">
                        1
                    </button>

                    <button class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
