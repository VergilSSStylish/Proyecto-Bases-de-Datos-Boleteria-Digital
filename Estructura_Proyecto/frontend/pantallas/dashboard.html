
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityBox | Dashboard</title>

    <script src="https://kit.fontawesome.com/21d7f36c31.js" crossorigin="anonymous"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <!--los botones para navegar-->
    <header class="header">
        <nav class="admin-navbar">

            <a href="dashboard.html">
                <img src="../assets/logoblanco.png" alt="CityBox" class="logo">
            </a>

            <div class="nav-options">
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="usuariosadmin.html">Usuarios</a>
                <a href="eventosadmin.html">Eventos</a>
                <a href="recintosadmin.html">Recintos</a>
                <a href="facturacionadmin.html">Facturación</a>
                <a href="configuracionadmin.html">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>

        </nav>
    </header>

    <main class="admin-container">

        <!--nombre del admin -->
        <section class="profile-card">

            <div class="profile-info">

                <div class="profile-icon">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <h2>nombre del admin</h2>
                </div>

            </div>

            <button class="btn btn-outline-danger logout-btn" id="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Cerrar sesión
            </button>

        </section>

        <!--estadisticas que vera el admin-->
        <section class="summary-section">

            <h2 class="section-title">
                Estadisticas
            </h2>

            <div class="stats-container">

                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fa-solid fa-wallet"></i>
                        Ingresos totales
                    </div>
                    <h2 id="total-ingresos">L —</h2>
                </div>

                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fa-solid fa-ticket"></i>
                        Boletos vendidos
                    </div>
                    <h2 id="total-boletos">—</h2>
                </div>

                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fa-solid fa-calendar-days"></i>
                        Eventos activos
                    </div>
                    <h2 id="total-eventos">—</h2>
                </div>

                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fa-solid fa-users"></i>
                        Clientes registrados
                    </div>
                    <h2 id="total-clientes">—</h2>
                </div>

            </div>

        </section>

        <!--graficos-->
        <section class="charts-container">

            <div class="admin-card">

                <h3 class="card-title">
                    <i class="fa-solid fa-chart-column"></i>
                    Ingresos por evento
                </h3>

                <hr>

                <div class="chart-content">
                    <canvas id="grafico-ingresos"></canvas>
                    <p class="empty-message">sin info</p> <!--Aqui van los datos de los ingresos por cada evento, pero ahora solo voy a ponerle sin info --> 
                </div>

            </div>

            <div class="admin-card">

                <h3 class="card-title">
                    <i class="fa-solid fa-chart-pie"></i>
                    Ocupación por zona
                </h3>

                <hr>

                <div class="chart-content">
                    <canvas id="grafico-ocupacion"></canvas>
                    <p class="empty-message">sin info</p> <!--igual que en ingresos por eventos-->
                </div>

            </div>

        </section>

        <!--los proximos eventos que se pueden agregar-->
        <section class="admin-card">

            <div class="card-header-admin">

                <h3 class="card-title">
                    <i class="fa-solid fa-calendar-days"></i>
                    Próximos eventos
                </h3>

                <a href="eventosadmin.html" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i>
                    Crear evento
                </a>

            </div>

            <hr>

            <div id="lista-eventos">
                <p class="empty-message">
                    sin info
                </p>
            </div>

        </section>

    </main>

    <script>
        document.getElementById("logout-btn").addEventListener("click", () => {
            localStorage.removeItem("token");
            localStorage.removeItem("usuario");
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
